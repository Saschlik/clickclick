[package]
name = "clickclick"
version = "1.0.0"
edition = "2021"
authors = ["Saschlik <sebalo.aleksander@googlemail.com>"]
description = "Ultra-low latency mechanical keyboard & mouse acoustic feedback daemon for Linux (evdev + PipeWire)"
license = "MIT"
repository = "https://github.com/saschlik/clickclick"
keywords = ["keyboard", "audio", "evdev", "pipewire", "mechanical-keyboard"]
categories = ["multimedia::audio", "command-line-utilities"]
default-run = "clickclickd"

[[bin]]
name = "clickclickd"
path = "src/main.rs"

[dependencies]
evdev = { version = "0.12", features = ["tokio"] }
rodio = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rand = "0.8"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
